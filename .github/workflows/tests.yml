name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Hardware tests need a real printer, so CI runs the unit tests only.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not printer"
